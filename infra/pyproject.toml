[project]
name = "my-castings-infra"
version = "0.1.0"
description = "AWS CDK app: every AWS resource for my-castings, defined as code"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.277.0",
    "constructs>=10.4,<11",
    "cdk-nag==3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_castings_infra"]
