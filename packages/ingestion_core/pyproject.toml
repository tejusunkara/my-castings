[project]
name = "ingestion-core"
version = "0.1.0"
description = "Email-digest adapters and parsing shared by the API and the ingestion Lambda"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "lxml>=5.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion_core"]
