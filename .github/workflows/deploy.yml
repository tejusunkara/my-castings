# Releases main to AWS. Runs as the last step of CI on a push to main (after every check
# passes) once the DEPLOY_ENABLED repository variable is "true", or by hand.
#
# The job uses the "production" environment: it only runs from main, waits for the
# owner's approval, and is the only place its secrets are available:
#   AWS_DEPLOY_ROLE_ARN    the GitHubDeploy stack's DeployRoleArn output
#   AWS_ACCOUNT_ID         \
#   ORIGIN_VERIFY_SECRET    } the values otherwise kept in ~/.cdk.json
#   BUDGET_ALERT_EMAIL     /
# GitHub masks secrets in logs, and the account id is masked too; logs are public.
#
# Order: App first (new image and task definitions), then migrations, then the rest. A
# migration must therefore keep the previous release working (add columns before code
# uses them; drop them a release later).
name: Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.6"

jobs:
  deploy:
    name: Release to AWS
    runs-on: ubuntu-24.04-arm # the images are ARM; build them natively
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # to exchange GitHub's OIDC token for the deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: infra/.nvmrc
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix infra
          npm ci --prefix apps/web
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: CDK settings kept out of the repository
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          python3 -c '
          import json, os, pathlib
          context = {
              "aws_account_id": os.environ["AWS_ACCOUNT_ID"],
              "origin_verify_secret": os.environ["ORIGIN_VERIFY_SECRET"],
              "budget_alert_email": os.environ["BUDGET_ALERT_EMAIL"],
          }
          pathlib.Path.home().joinpath(".cdk.json").write_text(json.dumps({"context": context}))
          '
      - name: Deploy the API (new image, rolling restart)
        working-directory: infra
        run: npx cdk deploy App --exclusively --require-approval never --progress events
      - name: Run database migrations
        run: uv run python scripts/aws/run_migration.py
      - name: Deploy ingestion and the website infrastructure
        working-directory: infra
        run: npx cdk deploy Ingestion Web --exclusively --require-approval never --progress events
      - name: Publish the frontend
        run: uv run python scripts/aws/deploy_web.py
