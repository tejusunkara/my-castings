[project]
name = "my-castings-api"
version = "0.1.0"
description = "FastAPI backend for the casting-call aggregator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "ingestion-core",
    "boto3>=1.44.12",
]

[tool.uv.sources]
ingestion-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
